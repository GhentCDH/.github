# Reusable workflow: build a Docker image and publish it to Docker Hub.
#
# Caller example (see README.md):
#
#   jobs:
#     publish:
#       uses: GhentCDH/.github/.github/workflows/dockerhub-publish.yaml@v1
#       with:
#         image: ghentcdh/my-app
#       secrets: inherit   # provides DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
#
# Which images get published depends on when the caller runs this workflow:
# a version tag v1.2.3 gives 1.2.3, 1.2, 1 and latest; a branch push gives the
# branch name; a pull request gives pr-<number>.
name: Docker Hub publish

on:
  workflow_call:
    inputs:
      image:
        description: Docker Hub image name without registry, e.g. ghentcdh/my-app
        required: true
        type: string
      tags:
        description: docker/metadata-action tag rules (one per line)
        required: false
        type: string
        default: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
      flavor:
        description: docker/metadata-action flavor; empty means latest=auto (latest on every non-prerelease semver tag)
        required: false
        type: string
        default: ''
      context:
        description: Build context
        required: false
        type: string
        default: .
      file:
        description: Dockerfile path (default <context>/Dockerfile)
        required: false
        type: string
        default: ''
      target:
        description: Build stage to target in a multi-stage Dockerfile
        required: false
        type: string
        default: ''
      build-args:
        description: Build arguments (one NAME=value per line)
        required: false
        type: string
        default: ''
      platforms:
        description: Target platforms
        required: false
        type: string
        default: linux/amd64
    secrets:
      DOCKERHUB_USERNAME:
        description: Docker Hub user (the GhentCDH organization secret, via secrets inherit)
        required: false
      DOCKERHUB_TOKEN:
        description: Docker Hub access token (the GhentCDH organization secret, via secrets inherit)
        required: false
    outputs:
      tags:
        description: The published image tags
        value: ${{ jobs.publish.outputs.tags }}
      digest:
        description: The image digest
        value: ${{ jobs.publish.outputs.digest }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ inputs.image }}
          tags: ${{ inputs.tags }}
          flavor: ${{ inputs.flavor }}

      - name: Check image tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          REF: ${{ github.ref }}
        run: |
          if [ -z "$TAGS" ]; then
            echo "::error::No image tags for $REF. Run this from a version tag (vX.Y.Z), or add tag rules for this event."
            exit 1
          fi
          echo "Publishing:"
          echo "$TAGS"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          build-args: ${{ inputs.build-args }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=docker.io/${{ inputs.image }}:buildcache
          cache-to: type=registry,ref=docker.io/${{ inputs.image }}:buildcache,mode=max
